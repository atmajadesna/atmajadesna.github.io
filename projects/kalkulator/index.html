<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator — Atmaja Desna Adinata</title>
<meta name="description" content="Kalkulator web dengan dukungan keyboard dan riwayat perhitungan. Dibuat dengan HTML, CSS, dan JavaScript murni.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><text x='50' y='70' font-size='48' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>=</text></svg>">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="back" href="../../">← Portfolio</a>
  <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema terang/gelap">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
  </button>
</header>

<main class="app app--narrow">

  <div class="app-head">
    <h1>Kalkulator</h1>
    <p class="app-sub">Bisa diklik, bisa juga pakai keyboard. Hasil perhitungan tersimpan di riwayat.</p>
  </div>

  <section class="calc" aria-label="Kalkulator">
    <div class="calc-display">
      <div class="calc-expr" id="expr" aria-live="polite">&nbsp;</div>
      <output class="calc-result" id="result" aria-live="polite">0</output>
    </div>

    <div class="keypad">
      <button class="key key-fn" data-key="C">C</button>
      <button class="key key-fn" data-key="back" aria-label="Hapus satu karakter">⌫</button>
      <button class="key key-fn" data-key="%">%</button>
      <button class="key key-op" data-key="÷">÷</button>

      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key key-op" data-key="×">×</button>

      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key key-op" data-key="−">−</button>

      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key key-op" data-key="+">+</button>

      <button class="key key-zero" data-key="0">0</button>
      <button class="key" data-key=".">.</button>
      <button class="key key-eq" data-key="=">=</button>
    </div>
  </section>

  <section class="history">
    <div class="history-head">
      <h2>Riwayat</h2>
      <button class="btn btn-ghost btn-small" id="clearHistory" type="button">Hapus</button>
    </div>
    <ul class="history-list" id="historyList"></ul>
    <p class="empty-sub center" id="historyEmpty">Belum ada perhitungan.</p>
  </section>

  <p class="hint">
    Keyboard: angka <kbd>0</kbd>–<kbd>9</kbd>, <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd>,
    <kbd>Enter</kbd> buat hasil, <kbd>Backspace</kbd> hapus, <kbd>Esc</kbd> reset.
  </p>

</main>

<footer class="app-footer">
  <p>Dibuat oleh <strong>Atmaja Desna Adinata</strong> · HTML, CSS, JavaScript murni</p>
</footer>

<script src="script.js"></script>
</body>
</html>
